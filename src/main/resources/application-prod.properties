# ----------------------------------------
# Server
# ----------------------------------------
server.port=8080

# ----------------------------------------
# Database (MySQL)
# ----------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ----------------------------------------
# Hikari Connection Pool
# ----------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000

# ----------------------------------------
# JPA / Hibernate
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----------------------------------------
# JWT / Token Configuration
# ----------------------------------------
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token.expire-time=1800000
jwt.refresh-token.expire-time=604800000

# ----------------------------------------
# Crypto / Hash
# ----------------------------------------
crypto.hash.ip.pepper=${CRYPTO_IP_PEPPER}
crypto.aes.key=${CRYPTO_AES_KEY}
crypto.hash.email.pepper=${CRYPTO_EMAIL_PEPPER}

# ----------------------------------------
# Log
# ----------------------------------------
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ----------------------------------------
# Mail (Gmail SMTP)
# ----------------------------------------
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ----------------------------------------
# Image Base URL
# ----------------------------------------
app.image.base-url=https://joomoney.me
